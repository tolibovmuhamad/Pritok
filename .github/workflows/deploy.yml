# Сборка и публикация демо на GitHub Pages (ветка gh-pages).
# Запускается при пуше в основную ветку; в остальных ветках задача пропускается.
name: Деплой демо

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm test

      # Сайт живёт по адресу /<имя репозитория>/, поэтому меняем базовый путь сборки.
      - run: npm run build -- --base=/${{ github.event.repository.name }}/

      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
